<div
  id="themeSongsPage"
  data-role="page"
  class="page type-interior pluginConfigurationPage"
  data-require="emby-input,emby-button,emby-checkbox"
>
  <style>
    #themeSongsPage .content-primary {
      max-width: 80rem;
      margin: 0 2rem;
      padding-bottom: 3rem;
    }
    #themeSongsPage .verticalSection {
      box-sizing: border-box;
      width: 100%;
      background: var(--jf-palette-background-paper);
      border: 1px solid var(--jf-palette-divider);
      border-radius: 0.75rem;
      padding: 1.4rem;
      margin-bottom: 1.25rem;
    }
    #themeSongsPage #themeSettings {
      max-width: none;
    }
    #themeSongsPage .verticalSection > h3:first-child {
      margin: 0 0 0.75rem;
    }
    #themeSongsPage .verticalSection > .fieldDescription {
      margin: 0 0 1.25rem;
    }
    #themeSongsPage .checkboxListContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
      column-gap: 1rem;
      max-width: 46rem;
      margin-bottom: 1rem;
    }
    #themeSongsPage .checkboxContainer {
      margin-bottom: 1.25rem;
    }
    #themeSongsPage .themeAutoOption {
      border-top: 1px solid var(--jf-palette-divider);
      padding-top: 1.25rem;
    }
    #themeSongsPage .inputContainer {
      margin-bottom: 0.75rem;
    }
    #themeSongsPage #themeSettings > button {
      margin: 0;
    }
    #themeSongsPage #themeSettings > button:disabled,
    #themeSongsPage #themeSettings > button:disabled:hover {
      background: var(--jf-palette-action-disabledBackground);
      color: var(--jf-palette-text-disabled);
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    #themeSongsPage .themeRowError {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--jf-palette-error-main);
      border-radius: 0.4rem;
      background: color-mix(
        in srgb,
        var(--jf-palette-error-main) 12%,
        var(--jf-palette-background-paper)
      );
      color: var(--jf-palette-text-primary);
      overflow-wrap: anywhere;
    }
    #themeSongsPage .themeRowError .material-icons {
      color: var(--jf-palette-error-main);
      font-size: 1.25em;
    }
    #themeSongsPage .themeSearch {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #themeSongsPage .themeSearch > .material-icons {
      color: var(--jf-palette-text-secondary);
    }
    #themeSongsPage .themeSearch input {
      min-width: 0;
      flex: 1;
    }
    #themeSongsPage #themeSettings > button,
    #themeSongsPage #themeScanStart,
    #themeSongsPage #themeScanCancel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 11rem;
    }
    #themeSongsPage [hidden] {
      display: none !important;
    }
    #themeSongsPage #themeScanPanel {
      margin-top: 1.25rem;
      padding: 1.25rem;
      background: var(--jf-palette-background-default);
      border: 1px solid var(--jf-palette-divider);
      border-radius: 0.5rem;
    }
    #themeSongsPage .themeProgressLabel,
    #themeSongsPage .themeRowBusy {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #themeSongsPage .themeProgressLabel {
      margin-bottom: 0.75rem;
    }
    #themeSongsPage #themeProgress {
      margin: 0;
    }
    #themeSongsPage .themeProgressLabel .material-icons,
    #themeSongsPage .themeRowBusy .material-icons {
      color: var(--jf-palette-primary-main);
      font-size: 1.25em;
      animation: themeSongsSpin 1.4s linear infinite;
    }
    #themeSongsPage .themeRowBusy {
      margin-top: 0.5rem;
      color: var(--jf-palette-text-secondary);
    }
    @keyframes themeSongsSpin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #themeSongsPage .themeProgressLabel .material-icons,
      #themeSongsPage .themeRowBusy .material-icons {
        animation: none;
      }
    }
    #themeSongsPage #themeScanPanel #themeScanDetails {
      margin: 0.75rem 0 0;
    }
    #themeSongsPage #themeScanCancel {
      margin-top: 1rem;
      background: var(--jf-palette-error-main);
      color: var(--jf-palette-error-contrastText);
    }
    #themeSongsPage #themeScanBar {
      height: 0.6rem;
      border: 0;
      border-radius: 999px;
      overflow: hidden;
      appearance: none;
      background: var(--jf-palette-action-selected) !important;
    }
    #themeSongsPage #themeScanBar::-webkit-progress-bar {
      background: var(--jf-palette-action-selected) !important;
      border-radius: 999px;
    }
    #themeSongsPage #themeScanBar::-webkit-progress-value {
      background: var(--jf-palette-primary-main);
      border-radius: 999px;
      transition: width 0.35s ease-out;
    }
    #themeSongsPage #themeScanBar::-moz-progress-bar {
      background: var(--jf-palette-primary-main);
      border-radius: 999px;
    }
    @media (prefers-reduced-motion: reduce) {
      #themeSongsPage #themeScanBar::-webkit-progress-value {
        transition: none;
      }
    }
    #themeSongsPage .detailTable {
      margin: 0.5rem 0 0;
    }
    #themeSongsPage .detailTable thead,
    #themeSongsPage .detailTable tbody tr {
      border-bottom: 1px solid var(--jf-palette-divider);
    }
    #themeSongsPage .detailTable tbody tr:last-child {
      border-bottom: 0;
    }
    #themeSongsPage .detailTable th,
    #themeSongsPage .detailTable td {
      padding: 0.85rem 0.6rem;
      vertical-align: middle;
    }
    #themeSongsPage .detailTable th {
      color: var(--jf-palette-text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #themeSongsPage .detailTable td strong {
      color: var(--jf-palette-text-primary);
      font-size: 1rem;
      font-weight: 600;
    }
    #themeSongsPage .detailTable td:nth-child(2) {
      font-variant-numeric: tabular-nums;
      color: var(--jf-palette-text-secondary);
    }
    #themeSongsPage .detailTable th:last-child,
    #themeSongsPage .detailTable td:last-child {
      width: 1%;
      text-align: left;
      white-space: nowrap;
    }
    #themeSongsPage .detailTable .fieldDescription {
      margin: 0.25rem 0 0;
      color: var(--jf-palette-text-secondary);
    }
    #themeSongsPage .detailTable td:last-child :is(a, button).emby-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 0;
      border-radius: 0.4rem;
      background: transparent;
      color: var(--jf-palette-text-secondary);
      vertical-align: middle;
    }
    #themeSongsPage
      .detailTable
      td:last-child
      :is(a, button).emby-button:hover:not(:disabled) {
      background: var(--jf-palette-action-hover);
      color: var(--jf-palette-text-primary);
    }
    #themeSongsPage
      .detailTable
      td:last-child
      button:last-child:hover:not(:disabled) {
      color: var(--jf-palette-error-main);
    }
    #themeSongsPage .detailTable td:last-child button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #themeSongsPage
      .detailTable
      td:last-child
      :is(a, button).emby-button:focus-visible {
      outline: 2px solid var(--jf-palette-primary-main);
      outline-offset: 2px;
    }
    #themeSongsPage .themeMobileDate {
      display: none;
    }
    #themeSongsPage #themePagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.25rem;
      margin-top: 1rem;
    }
    #themeSongsPage #themePagination button.emby-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 0;
      border-radius: 0.4rem;
      background: transparent;
      color: var(--jf-palette-text-secondary);
    }
    #themeSongsPage #themePagination button.emby-button:hover:not(:disabled) {
      background: var(--jf-palette-action-hover);
      color: var(--jf-palette-text-primary);
    }
    #themeSongsPage #themePagination button.emby-button:disabled {
      opacity: 0.4;
    }
    #themeSongsPage #themePagination button.emby-button:focus-visible {
      outline: 2px solid var(--jf-palette-primary-main);
      outline-offset: 2px;
    }
    #themeSongsPage #themePageInfo {
      margin-right: 0.75rem;
      color: var(--jf-palette-text-secondary);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 640px) {
      #themeSongsPage .content-primary {
        margin-left: 1rem;
        margin-right: 1rem;
      }
      #themeSongsPage .verticalSection {
        padding: 1.25rem;
      }
      #themeSongsPage #themeSettings > button,
      #themeSongsPage #themeScanStart,
      #themeSongsPage #themeScanCancel:not([hidden]) {
        display: flex;
        width: 100%;
        justify-content: center;
      }
      #themeSongsPage .detailTable th:nth-child(2),
      #themeSongsPage .detailTable td:nth-child(2) {
        display: none;
      }
      #themeSongsPage .themeMobileDate {
        display: block;
        margin-top: 0.25rem;
        color: var(--jf-palette-text-secondary);
        font-size: 0.875em;
      }
      #themeSongsPage .detailTable th,
      #themeSongsPage .detailTable td {
        padding: 0.75rem 0.25rem;
      }
      #themeSongsPage .detailTable td:last-child :is(a, button).emby-button {
        width: 2.4rem;
        height: 2.4rem;
      }
      #themeSongsPage #themePagination {
        justify-content: flex-end;
      }
    }
  </style>
  <div data-role="content" class="content-primary">
    <h2 class="sectionTitle">JellyScore</h2>
    <p class="fieldDescription" data-i18n="description">
      Automatically finds theme music for your movies and shows.
    </p>
    <form id="themeSettings" class="verticalSection">
      <h3 class="sectionTitle" data-i18n="libraries">Libraries</h3>
      <div id="themeLibraries" class="checkboxListContainer"></div>
      <div class="checkboxContainer themeAutoOption">
        <label class="emby-checkbox-label"
          ><input type="checkbox" name="enabled" is="emby-checkbox" /><span
            data-i18n="automatic"
            >Automatically process new items and library scans</span
          ></label
        >
      </div>
      <button
        is="emby-button"
        type="submit"
        class="raised button-submit"
        data-i18n="saveSettings"
        disabled
      >
        Save settings
      </button>
    </form>
    <section class="verticalSection">
      <h3 class="sectionTitle" data-i18n="fullScan">Full scan</h3>
      <p class="fieldDescription" data-i18n="scanHelp">
        Search selected libraries. Skip existing themes and retry deleted
        downloads.
      </p>
      <button
        is="emby-button"
        id="themeScanStart"
        class="raised"
        data-i18n="scanLibraries"
      >
        Scan libraries
      </button>
      <div id="themeScanPanel" hidden>
        <div class="themeProgressLabel">
          <span class="material-icons" aria-hidden="true">sync</span>
          <p id="themeProgress" role="status" aria-live="polite"></p>
        </div>
        <progress
          id="themeScanBar"
          aria-label="Theme scan progress"
          data-i18n-aria-label="scanProgress"
          max="100"
          value="0"
          style="width: 100%"
        ></progress>
        <p id="themeScanDetails" hidden></p>
        <div id="themeRejections"></div>
        <button
          is="emby-button"
          id="themeScanCancel"
          class="raised button-delete"
          data-i18n="cancelScan"
          disabled
          hidden
        >
          Cancel scan
        </button>
      </div>
    </section>
    <section class="verticalSection">
      <h3 class="sectionTitle" data-i18n="manageDownloads">Manage downloads</h3>
      <div class="inputContainer themeSearch">
        <span class="material-icons" aria-hidden="true">search</span>
        <input
          id="themeSearch"
          type="search"
          is="emby-input"
          placeholder="Title or library"
          data-i18n-placeholder="searchHint"
          aria-label="Search downloads"
          data-i18n-aria-label="searchDownloads"
        />
      </div>
      <p id="themeEmpty" hidden>No downloads.</p>
      <div style="overflow-x: auto">
        <table
          id="themeTable"
          class="detailTable"
          aria-label="Manage downloads"
          data-i18n-aria-label="downloadsTable"
          hidden
        >
          <thead>
            <tr>
              <th scope="col" class="detailTableHeaderCell" data-i18n="theme">
                Theme
              </th>
              <th scope="col" class="detailTableHeaderCell" data-i18n="added">
                Added
              </th>
              <th scope="col" class="detailTableHeaderCell" data-i18n="actions">
                Actions
              </th>
            </tr>
          </thead>
          <tbody id="themeRows"></tbody>
        </table>
      </div>
      <nav
        id="themePagination"
        aria-label="Downloads pages"
        data-i18n-aria-label="downloadsPages"
        hidden
      >
        <span id="themePageInfo"></span>
        <button
          is="emby-button"
          id="themePrevious"
          aria-label="Previous page"
          data-i18n-aria-label="previousPage"
          title="Previous page"
          data-i18n-title="previousPage"
        >
          <span class="material-icons" aria-hidden="true">chevron_left</span>
        </button>
        <button
          is="emby-button"
          id="themeNext"
          aria-label="Next page"
          data-i18n-aria-label="nextPage"
          title="Next page"
          data-i18n-title="nextPage"
        >
          <span class="material-icons" aria-hidden="true">chevron_right</span>
        </button>
      </nav>
    </section>
  </div>
  <script>
    (() => {
      const page = document.querySelector("#themeSongsPage");
      const $ = (selector) => page.querySelector(selector);
      let current = 1,
        total = 0;
      let scanRunning = false;
      let lastScan = null;
      let savedSettings = "";
      let scanPollError = "";
      let visible = false;
      let strings;
      const t = (key, ...values) =>
        (strings?.[key] ?? key).replace(
          /\{(\d+)\}/g,
          (_, index) => values[index],
        );
      const localize = () => {
        page.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        for (const attribute of ["placeholder", "aria-label", "title"]) {
          page
            .querySelectorAll("[data-i18n-" + attribute + "]")
            .forEach((el) => {
              el.setAttribute(
                attribute,
                t(el.getAttribute("data-i18n-" + attribute)),
              );
            });
        }
        updateRowActions();
      };
      const settingsValue = () =>
        JSON.stringify([
          $("#themeSettings").elements.enabled.checked,
          [
            ...$("#themeSettings").querySelectorAll(
              "input[name=library]:checked",
            ),
          ]
            .map((x) => x.value.toLowerCase())
            .sort(),
        ]);
      const updateSave = () => {
        $("#themeSettings button[type=submit]").disabled =
          settingsValue() === savedSettings;
      };
      const updateRowActions = () => {
        for (const button of page.querySelectorAll(
          "#themeRows button[data-theme-action]",
        )) {
          const busy = button.closest("tr").dataset.busy === "true";
          button.disabled = scanRunning || busy;
          button.title = scanRunning
            ? t("availableAfterScan")
            : busy
              ? t("working")
              : button.dataset.themeAction;
        }
      };
      const request = async (path, options = {}) => {
        const response = await fetch(ApiClient.getUrl("ThemeSongs/" + path), {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization:
              'MediaBrowser Token="' + ApiClient.accessToken() + '"',
            ...options.headers,
          },
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          const error = Error(body.Error || response.statusText);
          error.status = response.status;
          throw error;
        }
        return response.status === 204
          ? null
          : response.json().catch(() => null);
      };
      const loadStrings = async () => {
        if (strings) {
          localize();
          return;
        }
        const locale = (
          document.documentElement.lang ||
          navigator.language ||
          "en-us"
        ).toLowerCase();
        for (const value of new Set([locale, locale.split("-")[0], "en-us"])) {
          try {
            strings = await request("strings/" + encodeURIComponent(value));
            localize();
            return;
          } catch (e) {
            if (e.status !== 404) throw e;
          }
        }
        throw Error("No JellyScore translation dictionary is available.");
      };
      const toast = (text) => Dashboard.alert(text);
      const temporary = (e) =>
        e.status === 503 || e.message === "Failed to fetch";
      const silent = (e) =>
        temporary(e) || e.status === 401 || e.status === 403;
      const showError = (e) => {
        if (!silent(e)) toast(e.message);
      };
      const load = (fn) =>
        fn().catch((e) => {
          if (temporary(e)) {
            if (visible)
              setTimeout(() => {
                if (visible) load(fn);
              }, 3000);
          } else showError(e);
        });
      async function settings() {
        const data = await request("settings");
        const form = $("#themeSettings");
        if (!data.DownloaderAvailable) toast(t("downloaderMissing"));
        form.elements.enabled.checked = data.Enabled;
        $("#themeLibraries").replaceChildren(
          ...data.LibrariesAvailable.map((lib) => {
            const label = document.createElement("label");
            label.className = "emby-checkbox-label";
            const checkbox = document.createElement("input", "emby-checkbox");
            checkbox.type = "checkbox";
            checkbox.name = "library";
            checkbox.value = lib.ItemId;
            checkbox.checked = data.Libraries.some(
              (id) => id.toLowerCase() === lib.ItemId?.toLowerCase(),
            );
            const text = document.createElement("span");
            text.textContent = lib.Name;
            label.append(checkbox, text);
            return label;
          }),
        );
        savedSettings = settingsValue();
        updateSave();
      }
      async function rows() {
        const data = await request(
          "downloads?page=" +
            current +
            "&search=" +
            encodeURIComponent($("#themeSearch").value),
        );
        total = data.Total;
        if (current > 1 && (current - 1) * 25 >= total) {
          current--;
          return rows();
        }
        const container = $("#themeRows");
        container.replaceChildren();
        $("#themeEmpty").hidden = total !== 0;
        $("#themeEmpty").textContent = t(
          $("#themeSearch").value ? "noResults" : "noDownloads",
        );
        $("#themeTable").hidden = total === 0;
        $("#themePagination").hidden = total <= 25;
        $("#themePrevious").disabled = current === 1;
        $("#themeNext").disabled = current * 25 >= total;
        $("#themePageInfo").textContent = t(
          "pageOf",
          current,
          Math.ceil(total / 25),
        );
        const icon = (name) => {
          const span = document.createElement("span");
          span.className = "material-icons";
          span.setAttribute("aria-hidden", "true");
          span.textContent = name;
          return span;
        };
        for (const item of data.Items) {
          const row = document.createElement("tr");
          const theme = document.createElement("td");
          theme.className = "detailTableBodyCell";
          const heading = document.createElement("strong");
          heading.textContent = item.Name + " (" + (item.Year || "?") + ")";
          const status = document.createElement("div");
          status.className = "fieldDescription";
          status.hidden = item.Status === "Active";
          status.textContent = status.hidden ? "" : t("modified");
          const date = new Date(item.Date).toLocaleString();
          const mobileDate = document.createElement("div");
          mobileDate.className = "themeMobileDate";
          mobileDate.textContent = date;
          const error = document.createElement("div");
          error.className = "themeRowError";
          error.hidden = true;
          error.setAttribute("role", "alert");
          const errorText = document.createElement("span");
          error.append(icon("error_outline"), errorText);
          const showRowError = (e) => {
            if (!silent(e)) {
              errorText.textContent = e.message;
              error.hidden = false;
            }
          };
          const busy = document.createElement("div");
          busy.className = "themeRowBusy";
          busy.hidden = true;
          const busyText = document.createElement("span");
          busy.append(icon("sync"), busyText);
          const setBusy = (text) => {
            row.dataset.busy = String(Boolean(text));
            busy.hidden = !text;
            busyText.textContent = text;
            updateRowActions();
          };
          theme.append(heading, status, mobileDate, busy, error);
          const added = document.createElement("td");
          added.className = "detailTableBodyCell";
          added.textContent = date;
          const actions = document.createElement("td");
          actions.className = "detailTableBodyCell";
          const view = document.createElement("a");
          view.className = "emby-button";
          view.href = item.Source;
          view.target = "_blank";
          view.rel = "noopener noreferrer";
          view.setAttribute("aria-label", t("viewSourceFor", item.Name));
          view.title = t("viewSource");
          view.append(icon("open_in_new"));
          const refresh = document.createElement("button", "emby-button");
          refresh.className = "emby-button";
          refresh.append(icon("refresh"));
          refresh.setAttribute("aria-label", t("refreshThemeFor", item.Name));
          refresh.dataset.themeAction = t("refreshTheme");
          refresh.onclick = async () => {
            if (row.dataset.busy === "true") return;
            setBusy(t("refreshing"));
            error.hidden = true;
            try {
              const result = (
                await request(item.ItemId + "/refresh", { method: "POST" })
              ).Result;
              toast(
                t(
                  {
                    Replaced: "replaced",
                    "No replacement found": "noReplacement",
                    "Already themed": "alreadyThemed",
                  }[result] || result,
                ),
              );
              await load(rows);
            } catch (e) {
              showRowError(e);
            } finally {
              setBusy("");
            }
          };
          const remove = document.createElement("button", "emby-button");
          remove.className = "emby-button";
          remove.append(icon("delete"));
          remove.setAttribute("aria-label", t("deleteThemeFor", item.Name));
          remove.dataset.themeAction = t("deleteTheme");
          remove.onclick = async () => {
            if (row.dataset.busy === "true" || !confirm(t("confirmDelete")))
              return;
            setBusy(t("deleting"));
            error.hidden = true;
            try {
              await request(item.ItemId, { method: "DELETE" });
              row.remove();
              await load(rows);
            } catch (e) {
              showRowError(e);
            } finally {
              setBusy("");
            }
          };
          actions.append(view, refresh, remove);
          row.append(theme, added, actions);
          container.append(row);
        }
        updateRowActions();
      }
      async function progress() {
        const data = await request("scan");
        if (
          lastScan &&
          (data.Added > lastScan.Added ||
            (data.RunId !== lastScan.RunId && data.Added > 0) ||
            (lastScan.Running && !data.Running))
        )
          load(rows);
        lastScan = {
          RunId: data.RunId,
          Added: data.Added,
          Running: data.Running,
        };
        scanRunning = data.Running;
        updateRowActions();
        $("#themeScanStart").disabled = data.Running;
        $("#themeScanStart").hidden = data.Running;
        $("#themeScanCancel").disabled = !data.Running;
        $("#themeScanCancel").hidden = !data.Running;
        $("#themeScanPanel").hidden = !data.Running;
        const bar = $("#themeScanBar");
        bar.hidden = !data.Running && !data.Total;
        if (data.Running && data.Processed === 0) bar.removeAttribute("value");
        else
          bar.value = data.Total
            ? Math.round((100 * data.Processed) / data.Total)
            : 0;
        const remaining =
          data.Running && data.Processed > 0 && data.Total > data.Processed
            ? Math.ceil(
                ((Date.now() - Date.parse(data.StartedAt)) /
                  1000 /
                  data.Processed) *
                  (data.Total - data.Processed),
              )
            : null;
        const estimate =
          data.Running && data.Processed < data.Total
            ? remaining === null
              ? " · " + t("estimating")
              : remaining < 60
                ? " · " + t("lessThanMinute")
                : " · " + t("aboutMinutes", Math.ceil(remaining / 60))
            : data.Running && !data.Total
              ? " · " + t("estimating")
              : "";
        $("#themeProgress").textContent =
          (data.Total
            ? t("scanning", data.Processed, data.Total)
            : t("preparingScan")) +
          (data.CurrentItem ? " · " + data.CurrentItem : "") +
          estimate;
        const counts = [
          ["added", data.Added],
          ["existing", data.AlreadyThemed],
          ["excluded", data.Excluded],
          ["noMatch", data.NoMatch],
          ["unsupported", data.Unsupported],
          ["failed", data.Failed],
        ];
        const summary = counts
          .filter(([, count]) => count)
          .map(([label, count]) => t(label) + " " + count)
          .join(" · ");
        $("#themeScanDetails").hidden = !summary;
        $("#themeScanDetails").textContent = summary;
        const rejections = $("#themeRejections");
        rejections.replaceChildren();
        if (data.Rejections.length) {
          const heading = document.createElement("h4");
          heading.textContent = t("recentSkipped");
          const list = document.createElement("ul");
          for (const reason of data.Rejections) {
            const item = document.createElement("li");
            item.textContent = reason;
            list.append(item);
          }
          rejections.append(heading, list);
        }
      }
      const poll = () =>
        progress()
          .then(() => {
            scanPollError = "";
          })
          .catch((e) => {
            if (silent(e)) {
              scanPollError = "";
              return;
            }
            if (scanPollError !== e.message) {
              scanPollError = e.message;
              showError(e);
            }
          });
      page.addEventListener("pageshow", () => {
        visible = true;
        load(async () => {
          await loadStrings();
          load(settings);
          load(rows);
          poll();
        });
        page.timer = setInterval(() => {
          if (strings) poll();
        }, 3000);
      });
      page.addEventListener("pagehide", () => {
        visible = false;
        clearInterval(page.timer);
      });
      $("#themeSettings").addEventListener("change", updateSave);
      $("#themeSettings").onsubmit = async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        if (settingsValue() === savedSettings) return;
        const enabled = form.elements.enabled.checked;
        const libraries = [
          ...form.querySelectorAll("input[name=library]:checked"),
        ].map((x) => x.value);
        const submitted = settingsValue();
        $("#themeSettings button[type=submit]").disabled = true;
        try {
          await request("settings", {
            method: "POST",
            body: JSON.stringify({ enabled, libraries }),
          });
          savedSettings = submitted;
          toast(t("settingsSaved"));
        } catch (e) {
          showError(e);
        } finally {
          updateSave();
        }
      };
      $("#themeScanStart").onclick = async () => {
        try {
          await request("scan", { method: "POST" });
          await progress();
        } catch (e) {
          showError(e);
        }
      };
      $("#themeScanCancel").onclick = async () => {
        try {
          await request("scan/cancel", { method: "POST" });
          await progress();
        } catch (e) {
          showError(e);
        }
      };
      $("#themeSearch").oninput = () => {
        current = 1;
        load(rows);
      };
      $("#themePrevious").onclick = () => {
        current = Math.max(1, current - 1);
        load(rows);
      };
      $("#themeNext").onclick = () => {
        if (current * 25 < total) current++;
        load(rows);
      };
    })();
  </script>
</div>
